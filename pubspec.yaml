name: wallet_app
description: "Application de gestion financière personnelle - Mini-Projet Flutter ENSA Tanger 2025/2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Persistance locale (SQLite + SharedPreferences)
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Hash sécurisé des mots de passe
  crypto: ^3.0.3

  # Graphiques statistiques (camembert, barres, courbes)
  fl_chart: ^0.68.0

  # Formatage des dates et nombres
  intl: ^0.19.0

  # Icônes modernes (Font Awesome)
  font_awesome_flutter: ^10.7.0

  # Animations fluides
  flutter_animate: ^4.5.0

  # Sélection de date avec calendrier
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
